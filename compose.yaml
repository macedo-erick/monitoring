name: monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  monitoring:

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    networks: [monitoring]
    environment:
      CONTAINERS: '1'
      NETWORKS: '1'
      POST: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROM_RETENTION_TIME:-30d}'
      - '--storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-8GB}'
      - '--web.enable-lifecycle'
    ports: ['127.0.0.1:9090:9090']
    networks: [monitoring]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROM_TARGETS_DIR:-./prometheus/targets/prod}:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    extra_hosts: ['host.docker.internal:host-gateway']
    logging: *logging

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    networks: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    logging: *logging

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki-config.yml']
    ports: ['127.0.0.1:3100:3100']
    networks: [monitoring]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    logging: *logging

  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    networks: [monitoring]
    environment:
      MONITORING_HOST: ${MONITORING_HOST:?set MONITORING_HOST in .env}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki, socket-proxy]
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    privileged: true
    networks: [monitoring]
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
      - '--disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp'
    devices: ['/dev/kmsg:/dev/kmsg']
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    pid: host
    networks: [monitoring]
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/kubelet/.+)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    logging: *logging
