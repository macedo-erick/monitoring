global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels: { project: monitoring }

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: { project: monitoring }

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels: { project: monitoring }

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { project: monitoring }

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: { project: monitoring }

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels: { project: monitoring }

  - job_name: apps
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.yml']
        refresh_interval: 30s
